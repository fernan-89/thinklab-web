server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The browser only talks to /api; it is forwarded to the platform gateway with the prefix stripped,
  # so the app needs no CORS configuration and no gateway URL in the bundle.
  location /api/ {
    proxy_pass http://gateway:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 20s;
  }

  # Single-page app: unknown paths fall back to index.html so client-side routes survive a reload.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
}
