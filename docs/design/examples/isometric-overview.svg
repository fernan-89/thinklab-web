<svg class="iso" width="1100" viewBox="-653.8 -351 1303.2 612.5" role="img" aria-label="Exploded view of ThinkLab Quick Install" xmlns="http://www.w3.org/2000/svg"><style>svg.iso{width:100%;height:auto;display:block;margin:1.2rem 0;--d-face:#FFFFFF;--d-face2:#EEF1F6;--d-face3:#DFE4EC;--d-edge:#1B2A4A;--d-ink:#1B2A4A;--d-muted:#5B6785;--d-dot:#1B2A4A;--d-brand:#E95420;--d-blue:#0B64DD;--d-pink:#F04E98;--d-teal:#16B79A;--d-yellow:#FEC514;--d-navy:#101C3F;--d-nub:#E2231A}
svg.iso .cube polygon{stroke:var(--d-edge);stroke-width:1.1;stroke-linejoin:round}
